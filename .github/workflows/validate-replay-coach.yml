name: Validate replay coach catalogues

on:
  pull_request:
    paths:
      - "replay-coach/**"
      - "scripts/validate_replay_coach.py"
      - ".github/workflows/validate-replay-coach.yml"
  push:
    branches:
      - main
    paths:
      - "replay-coach/**"
      - "scripts/validate_replay_coach.py"
      - ".github/workflows/validate-replay-coach.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate replay coach content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate catalogue structure and translations
        run: python scripts/validate_replay_coach.py
